name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  simetria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Los datos coinciden con el generador
        run: |
          python3 tools/gen_data.py
          git diff --exit-code -- data/medidas.json || (echo "::error::data/medidas.json no está regenerado. Ejecuta tools/gen_data.py." && exit 1)
      - name: Pruebas de coherencia y simetría
        run: node tests/simetria.js
