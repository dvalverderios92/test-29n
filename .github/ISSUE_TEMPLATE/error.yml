name: Avisar de un error
description: Una medida mal recogida, una candidatura que falta, un sesgo o un fallo de la web.
title: "[Error] "
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Cuanto más concreto, antes se corrige. Si es posible, enlaza la fuente (mejor el programa oficial).
  - type: dropdown
    id: tipo
    attributes:
      label: ¿Qué tipo de error es?
      options:
        - Una medida está mal resumida o mal atribuida
        - Falta una medida importante
        - Una candidatura o un partido no aparece bien en mi comunidad
        - El efecto o el riesgo que me asigna no encaja con mi situación
        - Veo un sesgo a favor o en contra de un partido
        - Un fallo de la web (no carga, se ve mal, el PDF no se descarga…)
        - Otro
    validations:
      required: true
  - type: input
    id: partido
    attributes:
      label: Partido o candidatura afectada
      placeholder: Por ejemplo, Unidad del Pueblo Canario
  - type: input
    id: comunidad
    attributes:
      label: Tu comunidad autónoma (si influye)
  - type: textarea
    id: descripcion
    attributes:
      label: Qué está mal y cómo debería ser
    validations:
      required: true
  - type: input
    id: fuente
    attributes:
      label: Fuente que lo respalda (enlace)
      placeholder: https://…
  - type: markdown
    attributes:
      value: |
        No incluyas datos personales: el test no los necesita y este formulario es público.
